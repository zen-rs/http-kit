[workspace]
members = ["io", "h1", "h2", "h3", "tls"]

[package]
name = "http-kit"
version = "0.8.2"
edition = "2021"
rust-version = "1.87"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "MIT"
description = "A flexible and ergonomic HTTP toolkit for Rust with async support, middleware, and zero-copy body handling"
documentation = "https://docs.rs/http-kit"
repository = "https://github.com/lexoooooo/http-kit"
homepage = "https://github.com/lexoooooo/http-kit"
readme = "README.md"
keywords = ["http", "async", "middleware", "body", "streaming"]
categories = ["web-programming", "network-programming", "asynchronous"]

[dependencies]
http = { version = "1.3", default-features = false }
bytes = { version = "1.10", default-features = false }
mime = { version = "0.3.17", optional = true }
bytestr = "0.3.1"
futures-lite = { version = "2.6", default-features = false }
pin-project-lite = "0.2.16"
mime_guess = { version = "2.0.5", optional = true }
eyre = { version = "0.6.12", optional = true }

[dependencies.serde_json]
version = "1.0"
optional = true

[dependencies.serde_urlencoded]
version = "0.7.1"
optional = true

[dependencies.serde]
version = "1.0"
optional = true

[dependencies.http-body]
version = "1.0"
default-features = false


[dependencies.blocking]
version = "1.7"
default-features = false
optional = true

[dependencies.cookie]
version = "0.18"
optional = true

# The pipe types a `BodyFrame::Pipe` carries. Linux and Android only, like the
# frame.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies.http-kit-io]
version = "0.6.2"
path = "io"
optional = true

[features]
default = ["json", "form", "std", "cookie", "ws"]
std = ["dep:eyre", "dep:mime", "http/std", "bytes/std", "futures-lite/std"]
## `core::io` errors on no_std builds: nightly-only until
## `core_io_fundamentals` stabilizes (rust-lang/rust#154046).
core-io = []
full = ["json", "form", "std", "cookie", "fs"]
json = ["dep:serde", "dep:serde_json"]
form = ["dep:serde", "dep:serde_urlencoded"]
fs = ["std", "dep:blocking", "dep:mime_guess"]
ws = []
## `BodyFrame::Pipe`: body bytes still in the kernel, on Linux and Android (needs Rust 1.95, the I/O crate's).
pipe = ["std", "dep:http-kit-io"]
cookie = ["dep:cookie"]

[target.'cfg(any(unix, windows))'.dev-dependencies]
http-body-util = { version = "0.1.3" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1.3"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
http-kit-io = { version = "0.6.2", path = "io", features = ["tokio"] }

[lints.cargo]
unused_dependencies = "deny"
