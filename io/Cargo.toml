[package]
name = "http-kit-io"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "MIT"
description = "Runtime-neutral owned-buffer I/O for completion-based and readiness-based drivers"
documentation = "https://docs.rs/http-kit-io"
repository = "https://github.com/lexoooooo/http-kit"
homepage = "https://github.com/lexoooooo/http-kit"
keywords = ["io-uring", "async", "io", "thread-per-core", "network"]
categories = ["asynchronous", "network-programming"]

[features]
## compio: io_uring on Linux (falling back to polling where io_uring is unavailable), IOCP on Windows, polling elsewhere.
compio = ["dep:compio", "dep:libc", "dep:windows-sys"]
## tokio's reactor, adapted to owned buffers.
tokio = ["dep:tokio", "dep:socket2", "dep:libc", "dep:windows-sys"]
## async-io's reactor, adapted to owned buffers.
async-io = ["dep:async-io", "dep:socket2", "dep:libc", "dep:windows-sys"]

[dependencies]
compio-buf = { version = "0.8.3", default-features = false, features = ["bytes"] }
futures-io = { version = "0.3.34", default-features = false, features = ["std"] }

compio = { version = "0.19.2", default-features = false, features = ["runtime", "net", "time", "io-uring", "polling"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["net", "time"], optional = true }
async-io = { version = "2.6.0", default-features = false, optional = true }
socket2 = { version = "0.6.5", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.191", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO"], optional = true }

[dev-dependencies]
socket2 = { version = "0.6.5", default-features = false }
futures-lite = { version = "2.6.1", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package.metadata.docs.rs]
all-features = true
