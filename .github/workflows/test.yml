name: Test

on:
  workflow_call:
    inputs:
      # JSON list of runner OSes, computed by the `tier` job in ci.yml:
      # all three for pull requests into `main`, Linux otherwise.
      os:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      - uses: taiki-e/install-action@nextest
      # http-kit-h3's interop test needs a curl built with HTTP/3; Ubuntu's is not.
      - name: Install an HTTP/3 curl
        if: runner.os == 'Linux'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install curl
          echo "HTTP_KIT_H3_CURL=$(/home/linuxbrew/.linuxbrew/bin/brew --prefix curl)/bin/curl" >> "$GITHUB_ENV"
      # http-kit-h2's RFC 9113 / HPACK conformance suite.
      - name: Install h2spec
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz -o "$RUNNER_TEMP/h2spec.tar.gz"
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  $RUNNER_TEMP/h2spec.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$RUNNER_TEMP" h2spec
          chmod +x "$RUNNER_TEMP/h2spec"
          echo "HTTP_KIT_H2_H2SPEC=$RUNNER_TEMP/h2spec" >> "$GITHUB_ENV"
      # http-kit-tls asserts that its connections move to kernel TLS.
      - name: Load the kernel TLS module
        if: runner.os == 'Linux'
        run: sudo modprobe tls
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features
