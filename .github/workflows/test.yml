name: Test

on:
  workflow_call:
    inputs:
      # JSON list of runner OSes, computed by the `tier` job in ci.yml:
      # all three for pull requests into `main`, Linux otherwise.
      os:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      - uses: taiki-e/install-action@nextest
      # http-kit-h3's interop test needs a curl built with HTTP/3; Ubuntu's is not.
      - name: Install an HTTP/3 curl
        if: runner.os == 'Linux'
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install curl
          echo "HTTP_KIT_H3_CURL=$(/home/linuxbrew/.linuxbrew/bin/brew --prefix curl)/bin/curl" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features
